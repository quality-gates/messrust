name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      immutable_release: ${{ steps.release.outputs.immutable_release }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Install the release Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.85.1
      - id: release
        name: Validate the stable release identity
        uses: quality-gates/homebrew-tap/.github/actions/validate-source-release@92b635fe61fb926a5b13c7c59f163c3cec3ca756
        with:
          tool: messrust
          tag: ${{ env.TAG }}
          github-token: ${{ github.token }}

      - name: Require the Cargo package version
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t manifest_versions < <(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "messrust") | .version'
          )
          test "${#manifest_versions[@]}" -eq 1
          test "${manifest_versions[0]}" = "$VERSION"


  test:
    name: Run the full release test suite
    needs: validate
    if: needs.validate.outputs.immutable_release != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.85.1
      - run: cargo test --all-targets --locked
      - name: Build and run self-analysis
        run: |
          cargo build --release --locked
          ./target/release/messrust src text rust --ignore-tests

  build:
    name: Build native darwin/${{ matrix.arch }} archive
    needs: [validate, test]
    if: needs.validate.outputs.immutable_release != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            machine: arm64
            runner: macos-15
          - arch: amd64
            machine: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.85.1
      - name: Build and package on the target architecture
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          MACHINE: ${{ matrix.machine }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$MACHINE"
          cargo build --release --locked
          test "$(target/release/messrust --version)" = "messrust $VERSION"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          scripts/package-release \
            "$VERSION" "$ARCH" target/release/messrust dist "$source_date_epoch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: messrust-darwin-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  package:
    name: Make the release asset set
    needs: [validate, build]
    if: needs.validate.outputs.immutable_release != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: messrust-darwin-*
          path: dist
          merge-multiple: true
      - name: Require both archives and make checksums
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            "messrust_${VERSION}_darwin_amd64.tar.gz" \
            "messrust_${VERSION}_darwin_arm64.tar.gz" | LC_ALL=C sort)"
          actual="$(find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          test "$actual" = "$expected"
          (cd dist && sha256sum messrust_*.tar.gz | LC_ALL=C sort > checksums.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Smoke exact darwin/${{ matrix.arch }} release bytes
    needs: [validate, package]
    if: needs.validate.outputs.immutable_release != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            machine: arm64
            runner: macos-15
          - arch: amd64
            machine: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-assets
          path: dist
      - name: Verify, extract, and run the archive
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          MACHINE: ${{ matrix.machine }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$MACHINE"
          (cd dist && shasum -a 256 -c checksums.txt)
          archive="dist/messrust_${VERSION}_darwin_${ARCH}.tar.gz"
          expected_entries="$(printf '%s\n' LICENSE messrust | LC_ALL=C sort)"
          actual_entries="$(tar -tzf "$archive" | LC_ALL=C sort)"
          test "$actual_entries" = "$expected_entries"
          mkdir extracted
          tar -xzf "$archive" -C extracted
          cmp LICENSE extracted/LICENSE
          test -x extracted/messrust
          test "$(lipo -archs extracted/messrust)" = "$MACHINE"
          test "$(extracted/messrust --version)" = "messrust $VERSION"
          printf 'fn main() {}\n' > "$RUNNER_TEMP/smoke.rs"
          extracted/messrust "$RUNNER_TEMP/smoke.rs" json rust > "$RUNNER_TEMP/report.json"
          jq -e --arg version "$VERSION" \
            '.package == "messrust" and .version == $version and (.files | length == 0)' \
            "$RUNNER_TEMP/report.json" >/dev/null

  publish:
    name: Publish the immutable release and Homebrew formula
    needs: [validate, smoke]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (needs.smoke.result == 'success' || needs.validate.outputs.immutable_release == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 135
    environment: homebrew
    permissions:
      contents: write
    steps:
      - uses: quality-gates/homebrew-tap/.github/actions/publish-source-release@92b635fe61fb926a5b13c7c59f163c3cec3ca756
        with:
          tool: messrust
          tag: ${{ env.TAG }}
          version: ${{ needs.validate.outputs.version }}
          source-sha: ${{ needs.validate.outputs.source_sha }}
          immutable-release: ${{ needs.validate.outputs.immutable_release }}
          github-token: ${{ github.token }}
          tap-app-id: ${{ secrets.HOMEBREW_TAP_APP_ID }}
          tap-app-private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
